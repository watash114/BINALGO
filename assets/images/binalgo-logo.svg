<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #040812; font-family: 'Orbitron', 'Rajdhani', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#040812" />
  <rect width="100%" height="100%" fill="url(#cyber-grid)" />
  <circle cx="400" cy="250" r="180" fill="#00f0ff" opacity="0.04" filter="blur(50px)" />
  <g transform="translate(400, 240)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="14 10 30 8 8 12" filter="url(#glow)" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00d8ff" stroke-width="1.5" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="55" ry="130" fill="none" stroke="#00d8ff" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="130" ry="50" fill="none" stroke="#00d8ff" stroke-width="1.5" opacity="0.8" />
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#00d8ff" stroke-width="1.5" opacity="0.8" />
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#00d8ff" stroke-width="1.5" opacity="0.8" />
    <path d="M 0,-5 L 45,-38 L 15,35 Z" fill="#0088cc" opacity="0.9" />
    <path d="M 0,-5 L 45,-38 L 22,-5 Z" fill="#00f0ff" opacity="0.6" />
    <g transform="translate(45, -38)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#subtle-glow)" />
      <circle cx="0" cy="0" r="10" fill="#040812" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glow)" />
    </g>
  </g>
  <g transform="translate(400, 480)">
    <text x="0" y="0" font-size="52" font-weight="900" letter-spacing="12" text-anchor="middle">
      <tspan fill="#ffffff">BINAL</tspan><tspan fill="#00f0ff" filter="url(#subtle-glow)">GO</tspan>
    </text>
  </g>
</svg>